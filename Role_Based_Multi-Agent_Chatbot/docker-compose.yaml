version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-student-assistant
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    volumes:
      # Optional: Mount logs directory for persistent logs
      - ./logs:/app/logs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
